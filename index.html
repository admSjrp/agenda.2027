<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#98CDBD">
<title>Agenda CCB Rio Preto 2027</title>
<style>
  /* Cores do Manual de Identidade Visual CCB (Rev. 05) */
  :root {
    --verde: #98CDBD;      /* cor secundária: faixas e fundos */
    --preto: #201E1E;      /* texto */
    --cinza: #CDD4DC;      /* cinza padrão */
    --linha: #A5A5A5;      /* divisórias */
    --destaque: #DC3C00;   /* domingos, feriados, RRM e RA */
    --fundo: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: Verdana, "DejaVu Sans", Geneva, sans-serif; color: var(--preto); background: var(--fundo);
         font-size: 14px; line-height: 1.4; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }

  header { background: var(--verde); padding: 18px 16px 14px; text-align: center; }
  header img { width: 112px; display: block; margin: 0 auto 10px; }
  header h1 { font-size: 17px; font-weight: normal; }
  header p { font-size: 12px; margin-top: 2px; }

  nav.abas { position: sticky; top: 0; z-index: 5; background: var(--fundo); display: flex;
             border-bottom: 1px solid var(--preto); }
  nav.abas button { flex: 1; padding: 12px 4px; font-size: 12px; letter-spacing: .3px; text-transform: uppercase;
                    border-bottom: 3px solid transparent; }
  nav.abas button[aria-selected="true"] { border-bottom-color: var(--preto); font-weight: bold; }

  main { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
  .painel[hidden] { display: none; }

  /* título no padrão da agenda impressa: linha + nome em caixa alta */
  .tit { display: flex; align-items: flex-end; gap: 8px; font-size: 15px; letter-spacing: .5px;
         text-transform: uppercase; margin: 22px 0 6px; }
  .tit::before { content: ""; flex: 1; border-bottom: 1px solid var(--preto); margin-bottom: 5px; }

  .meses { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
  .meses::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 6px 12px; border: 1px solid var(--linha); border-radius: 0; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--preto); color: #fff; border-color: var(--preto); }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0 0; }
  input[type=search] { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); font: inherit; font-size: 14px;
                       margin-top: 12px; border-radius: 0; }

  .proximas { margin-top: 16px; border-top: 1px solid var(--preto); }
  .proximas h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; padding: 10px 0 2px; font-weight: bold; }

  .dia { display: flex; gap: 10px; border-bottom: 1px solid var(--linha); padding: 10px 0; }
  .dlab { width: 58px; flex-shrink: 0; font-size: 13px; }
  .dlab.verm { color: var(--destaque); }
  .evs { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .ev { display: flex; gap: 10px; font-size: 13px; }
  .ev .h { width: 42px; flex-shrink: 0; }
  .ev .t { flex: 1; }
  .ev.dest { color: var(--destaque); }
  .ev .loc { font-size: 12px; opacity: .8; }
  .fer { color: var(--destaque); font-size: 13px; }
  .ics { font-size: 11px; text-decoration: underline; margin-left: 4px; white-space: nowrap; color: var(--preto); opacity: .75; }
  .vazio-msg { padding: 24px 0; text-align: center; font-size: 13px; opacity: .7; }

  .lin { border-bottom: 1px solid var(--linha); padding: 10px 0; display: flex; gap: 10px; font-size: 13px; }
  .lin .c1 { width: 92px; flex-shrink: 0; }

  .casa { border-bottom: 1px solid var(--linha); padding: 12px 0; }
  .casa-l1 { display: flex; justify-content: space-between; gap: 8px; }
  .casa-n { font-weight: bold; text-transform: uppercase; font-size: 13px; }
  .casa-cod { font-size: 11px; opacity: .75; white-space: nowrap; }
  .casa-end { font-size: 12px; margin-top: 2px; }
  .casa-end a { text-decoration: underline; }
  .casa-cul { font-size: 13px; margin-top: 4px; word-spacing: 2px; }
  .legenda { font-size: 11px; opacity: .8; padding: 10px 0 0; }

  footer { text-align: center; font-size: 11px; padding: 24px 16px 32px; opacity: .75; }
  footer .status::before { content: "●"; margin-right: 4px; }
  footer .status.vivo::before { color: #5DB196; }
  footer .status.copia::before { color: var(--linha); }
</style>
</head>

/* CSV simples (aspas e vírgulas dentro de campos) */
function lerCSV(txt) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (aspas) {
      if (c === '"' && txt[i+1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && txt[i+1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  const cab = (linhas.shift() || []).map(h => h.trim());
  return linhas.filter(l => l.some(v => v.trim() !== ""))
               .map(l => Object.fromEntries(cab.map((h, i) => [h, (l[i] ?? "").trim()])));
}
/* "07/01/2027" -> "2027-01-07" */
function brParaISO(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || "");
  return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : null;
}

async function aba(nome) {
  const url = `https://docs.google.com/spreadsheets/d/${PLANILHA_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(nome)}`;
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(nome);
  const t = await r.text();
  if (t.trim().startsWith("<")) throw new Error("planilha não compartilhada");   // devolveu página de login
  return lerCSV(t);
}

async function carregarAoVivo() {
  try {
    const [ev, casas, fer, cfg] = await Promise.all([aba("Eventos"), aba("Casas de Oração"), aba("Feriados"), aba("Config")]);
    const eventos = ev.map(r => ({
        data: brParaISO(r["Data"]), hora: r["Hora"], sigla: r["Sigla"], servico: r["Serviço"],
        local: r["Local"], destaque: (r["Destaque"] || "").toUpperCase() === "S",
        online: (r["Exibir online"] || "S").toUpperCase() !== "N" }))
      .filter(e => e.data && e.servico && e.online)
      .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
    if (!eventos.length) throw new Error("sem eventos");
    const dias = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    D = {
      gerado_em: null,
      cfg: Object.fromEntries(cfg.map(r => [r["Chave"], r["Valor"]])),
      eventos,
      feriados: Object.fromEntries(fer.map(r => [brParaISO(r["Data"]), r["Feriado"]]).filter(x => x[0])),
      casas: casas.filter(r => r["Casa de Oração"]).map(r => ({
        nome: r["Casa de Oração"], codigo: r["Código"], endereco: r["Endereço"], cep: r["CEP"], rjm: r["RJM"],
        cultos: dias.filter(d => r[d]).map(d => [d, r[d]]) }))
    };
    try { localStorage.setItem("agenda-ccb", JSON.stringify(D)); } catch (e) {}
    status(true);
  } catch (e) {
    // Sem acesso à planilha: usa a última versão salva no celular, ou a cópia embutida.
    try { const s = JSON.parse(localStorage.getItem("agenda-ccb")); if (s && s.eventos?.length) D = s; } catch (_) {}
    status(false);
  }
  desenhar();
}

function status(vivo) {
  const el = $("#status");
  el.className = "status " + (vivo ? "vivo" : "copia");
  el.textContent = vivo ? "Dados atualizados da planilha oficial"
                        : `Versão salva${COPIA.gerado_em ? " em " + COPIA.gerado_em : ""}`;
}

/* ==========================================================================

   ========================================================================== */
function linhaEvento(e) {
  const sig = e.sigla ? `<b>${esc(e.sigla)}</b> - ` : "";
  const loc = e.local && !e.servico.includes(e.local) ? ` <span class="loc">(${esc(e.local)})</span>` : "";
  return `<div class="ev${e.destaque ? " dest" : ""}"><span class="h">${esc(e.hora)}</span>
    <span class="t">${sig}${esc(e.servico)}${loc}<button class="ics" data-ics="${esc(JSON.stringify(e))}">+ agenda</button></span></div>`;
}

function desenharProximas() {
  const hoje = iso(new Date());
  const prox = D.eventos.filter(e => e.data >= hoje).slice(0, 3);
  if (!prox.length) { $("#proximas").innerHTML = ""; return; }
  $("#proximas").innerHTML = `<h2>Próximas reuniões</h2>` + prox.map(e => {
    const d = dataDe(e.data);
    return `<div class="dia"><div class="dlab">${ddmm(d)}<br>${SEMANA[d.getDay()]}</div><div class="evs">${linhaEvento(e)}</div></div>`;
  }).join("");
}

function desenharMeses() {
  $("#meses").innerHTML = MESES.map((m, i) =>
    `<button class="chip" data-mes="${i}" aria-pressed="${i === mesSel}">${m.slice(0,3)}</button>`).join("");
  $("#siglas").innerHTML = SIGLAS.map(s =>
    `<button class="chip" data-sigla="${s}" aria-pressed="${s === siglaSel}">${s}</button>`).join("");
  const ativo = $(`#meses [data-mes="${mesSel}"]`);
  if (ativo) ativo.scrollIntoView({ inline: "center", block: "nearest" });
}

function desenharEventos() {
  const termo = $("#busca-ev").value.trim().toLowerCase();
  const filtro = e => (!siglaSel || e.sigla === siglaSel) &&
                      (!termo || (e.servico + " " + e.local + " " + e.sigla).toLowerCase().includes(termo));
  let html = "";
  if (termo || siglaSel) {
    // Com busca/sigla: lista o ano inteiro agrupado por mês
    const achados = D.eventos.filter(filtro);
    let mesAtual = -1;
    for (const e of achados) {
      const d = dataDe(e.data);
      if (d.getMonth() !== mesAtual) { mesAtual = d.getMonth(); html += `<div class="tit">${MESES[mesAtual]}</div>`; }
      html += `<div class="dia"><div class="dlab${d.getDay() === 0 || D.feriados[e.data] ? " verm" : ""}">${dd(d)}|${SEMANA[d.getDay()]}</div><div class="evs">${linhaEvento(e)}</div></div>`;
    }
    if (!achados.length) html = `<div class="vazio-msg">Nenhuma reunião encontrada.</div>`;
  } else {
    // Sem busca: mostra o mês escolhido, dia a dia (só os dias com reunião ou feriado)
    const ano = Number(D.cfg.ano) || dataDe(D.eventos[0].data).getFullYear();
    html += `<div class="tit">${MESES[mesSel]}</div>`;
    const ult = new Date(ano, mesSel + 1, 0).getDate();
    for (let d = 1; d <= ult; d++) {
      const dt = new Date(ano, mesSel, d), k = iso(dt);
      const evs = D.eventos.filter(e => e.data === k);
      const fer = D.feriados[k];
      if (!evs.length && !fer) continue;
      html += `<div class="dia"><div class="dlab${dt.getDay() === 0 || fer ? " verm" : ""}">${dd(dt)}|${SEMANA[dt.getDay()]}</div>
        <div class="evs">${fer ? `<div class="fer">${esc(fer)}</div>` : ""}${evs.map(linhaEvento).join("")}</div></div>`;
    }
  }
  $("#lista-eventos").innerHTML = html;
}

/* Arquivo .ics para o irmão salvar a reunião na agenda do celular */
function baixarICS(e) {
  const [h, m] = (e.hora || "19:30").split(":").map(Number);
  const ini = e.data.replace(/-/g, "") + "T" + String(h).padStart(2,"0") + String(m).padStart(2,"0") + "00";
  const fimD = new Date(0, 0, 0, h + 2, m);
  const fim = e.data.replace(/-/g, "") + "T" + String(fimD.getHours()).padStart(2,"0") + String(fimD.getMinutes()).padStart(2,"0") + "00";
  const titulo = (e.sigla ? e.sigla + " - " : "") + e.servico;
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CCB Rio Preto//Agenda//PT",
    "BEGIN:VEVENT", `UID:${ini}-${Math.random().toString(36).slice(2)}@ccb-rio-preto`,
    `DTSTART;TZID=America/Sao_Paulo:${ini}`, `DTEND;TZID=America/Sao_Paulo:${fim}`,
    `SUMMARY:${titulo.replace(/,/g, "\\,")}`, e.local ? `LOCATION:${e.local.replace(/,/g, "\\,")}` : "",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "reuniao.ics"; a.click();
}

    return `<div class="lin"><span class="c1">${ddmm(d)}|${SEMANA[d.getDay()]}</span><span>${esc(e.hora)} - ${esc(casa)}</span></div>`; };
  $("#lista-batismos").innerHTML = `<div class="tit">Batismos</div>` + bat.map(linha).join("");
  $("#lista-mocidade").innerHTML = `<div class="tit">Reunião para Mocidade</div>` + moc.map(linha).join("");
}

/* ==========================================================================
   CASAS DE ORAÇÃO
   ========================================================================== */
function desenharCasas() {
  $("#dias-culto").innerHTML = SEMANA.map(d =>
    `<button class="chip" data-dia="${d}" aria-pressed="${d === diaCultoSel}">${d}</button>`).join("");
  $("#legenda").textContent = D.cfg.legenda_cultos || "";
  const termo = $("#busca-casa").value.trim().toLowerCase();
  const lista = D.casas.filter(c =>
      (!termo || (c.nome + " " + c.endereco).toLowerCase().includes(termo)) &&
      (!diaCultoSel || c.cultos.some(([d]) => d === diaCultoSel)));
  $("#lista-casas").innerHTML = `<div class="tit">Casas de Oração</div>` + (lista.length ? lista.map(c => {
    const mapa = "https://www.google.com/maps/search/?api=1&query=" +
                 encodeURIComponent(`${c.endereco}, ${c.cep}, São José do Rio Preto`);
    const cultos = c.cultos.map(([d, v]) => `<b>${d}</b> ${esc(v)}`).join("  ");
    return `<div class="casa"><div class="casa-l1"><span class="casa-n">${esc(c.nome)}</span><span class="casa-cod">${esc(c.codigo)}</span></div>
      <div class="casa-end"><a href="${mapa}" target="_blank" rel="noopener">${esc(c.endereco)} - CEP ${esc(c.cep)}</a></div>
      <div class="casa-cul">${cultos}${c.rjm ? `  <b>RJM</b> ${esc(c.rjm)}` : ""}</div></div>`;
  }).join("") : `<div class="vazio-msg">Nenhuma casa de oração encontrada.</div>`);
}

/* ==========================================================================
   MONTAGEM E EVENTOS DE TELA
   ========================================================================== */
function desenhar() {
  const ano = Number(D.cfg.ano) || 2027;
  if (mesSel === null) { const h = new Date(); mesSel = h.getFullYear() === ano ? h.getMonth() : 0; }
  $("#adm").textContent = D.cfg.administracao || "Administração São José do Rio Preto";
  desenharProximas(); desenharMeses(); desenharEventos(); desenharResumo(); desenharCasas();
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.aba) {
    document.querySelectorAll("nav.abas button").forEach(x => x.setAttribute("aria-selected", x === b));
    document.querySelectorAll(".painel").forEach(p => p.hidden = p.id !== b.dataset.aba);
    window.scrollTo({ top: 0 });
  } else if (b.dataset.mes) { mesSel = Number(b.dataset.mes); siglaSel = null; $("#busca-ev").value = ""; desenharMeses(); desenharEventos(); }
  else if (b.dataset.sigla) { siglaSel = siglaSel === b.dataset.sigla ? null : b.dataset.sigla; desenharMeses(); desenharEventos(); }
  else if (b.dataset.dia) { diaCultoSel = diaCultoSel === b.dataset.dia ? null : b.dataset.dia; desenharCasas(); }
  else if (b.dataset.ics) { baixarICS(JSON.parse(b.dataset.ics)); }
});
$("#busca-ev").addEventListener("input", desenharEventos);
$("#busca-casa").addEventListener("input", desenharCasas);

status(false);
desenhar();          // mostra a cópia imediatamente
carregarAoVivo();    // e atualiza com a planilha se estiver acessível
</script>
</body>
</html>
